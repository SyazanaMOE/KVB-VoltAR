<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KVB VoltAR - Kerintangan</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>

body{
margin:0;
overflow:hidden;
}

#backButton{

position:fixed;
top:20px;
left:20px;
z-index:999;

padding:12px 20px;

background:#1565c0;
color:white;

border:none;
border-radius:8px;

font-size:16px;

}

</style>

</head>

<body>

<button id="backButton"
onclick="window.location.href='resistance.html'">

← Kembali

</button>

<a-scene
embedded
arjs="sourceType:webcam; debugUIEnabled:false;">

<a-marker preset="hiro">

<!-- Tajuk -->

<a-text

value="KERINTANGAN"

position="0 2.4 0"

align="center"

scale="1.2 1.2 1.2"

color="green">

</a-text>

<!-- Formula -->

<a-text

value="R = (rho)L / A"

position="0 2.0 0"

align="center"

scale="1 1 1"

color="blue">

</a-text>

<!-- Konduktor -->

<a-cylinder

position="0 0.5 0"

rotation="0 0 90"

radius="0.08"

height="2.2"

color="#BDBDBD">

</a-cylinder>

<!-- Anak panah Panjang -->

<a-text

value="<------ L ------>"

position="0 -0.1 0"

align="center"

scale="0.8 0.8 0.8"

color="red">

</a-text>

<!-- Label Luas -->

<a-text

value="A"

position="1.35 0.8 0"

align="center"

scale="1 1 1"

color="orange">

</a-text>

<!-- Label Bahan -->

<a-text

value="rho = KUPRUM"

position="-1.2 1.1 0"

align="center"

scale="0.7 0.7 0.7"

color="purple">

</a-text>

<!-- Nota -->

<a-text

value="Panjang ↑\nKerintangan ↑"

position="0 -0.9 0"

align="center"

scale="0.7 0.7 0.7"

color="black">

</a-text>

</a-marker>

<a-entity camera></a-entity>

</a-scene>

</body>

</html>
