<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KVB VoltAR - Kerintangan</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>

body{
    margin:0;
    overflow:hidden;
}

#backButton{
    position:fixed;
    top:20px;
    left:20px;
    z-index:999;

    padding:12px 20px;

    background:#1565c0;
    color:white;

    border:none;
    border-radius:8px;

    font-size:16px;
}

</style>

</head>

<body>

<button
id="backButton"
onclick="window.location.href='resistance.html'">

← Kembali

</button>

<a-scene
embedded
arjs="sourceType: webcam; debugUIEnabled:false;">

<a-marker preset="hiro">

<a-entity
id="resistanceScene"
scale="0.42 0.42 0.42">


<!-- ========================= -->
<!-- PANEL TAJUK DAN FORMULA -->
<!-- ========================= -->

<a-plane
    position="0 3.10 -0.08"
    width="2.55"
    height="0.78"
    color="#E8F5E9"
    opacity="0.95">
</a-plane>

<a-text
    value="FAKTOR KERINTANGAN"
    position="0 3.28 0.02"
    align="center"
    width="3.40"
    color="#1B5E20">
</a-text>

<a-text
    value="R = rho L / A"
    position="0 2.96 0.02"
    align="center"
    width="3.00"
    color="#0D47A1">
</a-text>


<!-- ========================= -->
<!-- PENERANGAN FORMULA -->
<!-- ========================= -->

<a-plane
    position="0 2.53 -0.08"
    width="2.40"
    height="0.42"
    color="#FFFFFF"
    opacity="0.95">
</a-plane>

<a-text
    value="Kerintangan dipengaruhi oleh\njenis bahan, panjang dan luas."
    position="0 2.53 0.02"
    align="center"
    width="2.55"
    color="#263238">
</a-text>


<!-- ========================= -->
<!-- PANEL JENIS BAHAN -->
<!-- ========================= -->

<a-plane
    position="0 1.92 -0.08"
    width="2.05"
    height="0.68"
    color="#F3E5F5"
    opacity="0.95">
</a-plane>

<a-text
    value="JENIS BAHAN (rho)"
    position="0 2.10 0.02"
    align="center"
    width="2.55"
    color="#6A1B9A">
</a-text>

<a-text
    value="Setiap bahan mempunyai\nnilai rho yang berbeza."
    position="0 1.80 0.02"
    align="center"
    width="2.10"
    color="#6A1B9A">
</a-text>


<!-- ========================= -->
<!-- MODEL KONDUKTOR -->
<!-- ========================= -->

<a-cylinder
    position="0 1.18 0"
    rotation="0 0 90"
    radius="0.10"
    height="2.00"
    color="#B87333">
</a-cylinder>


<!-- ========================= -->
<!-- PENUNJUK PANJANG -->
<!-- ========================= -->

<a-text
    value="<------ L ------>"
    position="0 0.83 0.02"
    align="center"
    width="3.00"
    color="#D50000">
</a-text>


<!-- ========================= -->
<!-- PANEL PANJANG -->
<!-- ========================= -->

<a-plane
    position="0 0.30 -0.08"
    width="2.15"
    height="0.68"
    color="#E3F2FD"
    opacity="0.95">
</a-plane>

<a-text
    value="PANJANG WAYAR (L)"
    position="0 0.49 0.02"
    align="center"
    width="2.70"
    color="#0D47A1">
</a-text>

<a-text
    value="Semakin panjang wayar,\nsemakin tinggi kerintangan."
    position="0 0.17 0.02"
    align="center"
    width="2.20"
    color="#0D47A1">
</a-text>


<!-- ========================= -->
<!-- PANEL LUAS -->
<!-- ========================= -->

<a-plane
    position="0 -0.50 -0.08"
    width="2.15"
    height="0.68"
    color="#FFF3E0"
    opacity="0.95">
</a-plane>

<a-text
    value="LUAS KERATAN RENTAS (A)"
    position="0 -0.31 0.02"
    align="center"
    width="2.70"
    color="#E65100">
</a-text>

<a-text
    value="Semakin besar luas,\nsemakin rendah kerintangan."
    position="0 -0.63 0.02"
    align="center"
    width="2.20"
    color="#E65100">
</a-text>


<!-- ========================= -->
<!-- RUMUSAN -->
<!-- ========================= -->

<a-plane
    position="0 -1.42 -0.08"
    width="2.50"
    height="0.92"
    color="#ECEFF1"
    opacity="0.95">
</a-plane>

<a-text
    value="RUMUSAN"
    position="0 -1.15 0.02"
    align="center"
    width="2.40"
    color="#212121">
</a-text>

<a-text
    value="L meningkat, R meningkat\nA meningkat, R menurun\nrho meningkat, R meningkat"
    position="0 -1.51 0.02"
    align="center"
    width="2.15"
    color="#212121">
</a-text>


<!-- ========================= -->
<!-- FORMULA AKHIR -->
<!-- ========================= -->

<a-plane
    position="0 -2.18 -0.08"
    width="2.20"
    height="0.44"
    color="#E8F5E9"
    opacity="0.95">
</a-plane>

<a-text
    value="R = rho L / A"
    position="0 -2.18 0.02"
    align="center"
    width="2.80"
    color="#1B5E20">
</a-text>


</a-entity>

</a-marker>

<a-entity camera></a-entity>

</a-scene>

</body>

</html>
