<p>

</p>

<hr>

<h3>Formula Kerintangan</h3>

<h2>R = ρL / A</h2>

<p>

R = Kerintangan (Ω)

</p>

<p>

ρ = Kerintangan tentu bahan

</p>

<p>

L = Panjang konduktor

</p>

<p>

A = Luas keratan rentas

</p>
