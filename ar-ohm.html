<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KVB VoltAR - Litar Hukum Ohm</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>

body{
    margin:0;
    overflow:hidden;
}

#backButton{

    position:fixed;

    top:20px;

    left:20px;

    z-index:999;

    padding:12px 20px;

    background:#1565c0;

    color:white;

    border:none;

    border-radius:8px;

    font-size:16px;

}

</style>

</head>


<body>


<button id="backButton"
onclick="window.location.href='ohm.html'">

← Kembali

</button>


<a-scene
embedded
arjs="sourceType: webcam; debugUIEnabled:false;">
<a-assets>

    <a-asset-item
        id="batteryModel"
        src="models/battery.glb">
    </a-asset-item>

</a-assets>

<a-marker preset="hiro">


<!-- ========================= -->
<!-- MODEL BATERI -->
<!-- ========================= -->

<a-entity
    gltf-model="#batteryModel"
    position="-1.28 0.50 0"
    rotation="0 180 90"
    scale="8 8 8">
</a-entity>


<!-- ========================= -->
<!-- LABEL BATERI -->
<!-- ========================= -->

<a-text
value="SUMBER VOLTAN (V)"
position="-1.20 2.70 0"
align="center"
scale="0.8 0.8 0.8"
color="blue">
</a-text>

<a-text
value="TERMINAL POSITIF (+)"
position="-1.20 1.90 0"
align="center"
scale="0.65 0.65 0.65"
color="red">
</a-text>

<a-text
value="TERMINAL NEGATIF (-)"
position="-1.20 -0.90 0"
align="center"
scale="0.65 0.65 0.65"
color="black">
</a-text>


<!-- ========================= -->
<!-- WAYAR -->
<!-- ========================= -->

<a-cylinder
position="0.00 0.50 0"
rotation="0 0 90"
radius="0.05"
height="2.20"
color="#1565c0">
</a-cylinder>


<!-- ========================= -->
<!-- ARUS -->
<!-- ========================= -->

<a-sphere
radius="0.06"
color="#00ff00"
position="-0.70 0.50 0"

animation="
property: position;
from: -0.70 0.50 0;
to: 0.90 0.50 0;
dur: 1500;
dir: alternate;
loop: true;
easing: linear;">
</a-sphere>

<a-text
value="ARUS ELEKTRIK (I)"
position="0.00 0.95 0"
align="center"
scale="0.8 0.8 0.8"
color="green">
</a-text>


<!-- ========================= -->
<!-- PERINTANG -->
<!-- ========================= -->

<a-box
position="1.20 0.50 0"
width="0.45"
height="0.25"
depth="0.25"
color="#D2691E">
</a-box>

<a-text
value="RINTANGAN (R)"
position="1.20 1.15 0"
align="center"
scale="0.8 0.8 0.8"
color="orange">
</a-text>


<!-- ========================= -->
<!-- FORMULA -->
<!-- ========================= -->

<a-text
value="HUKUM OHM\nV = I x R"
position="0 2.35 0"
align="center"
scale="1.2 1.2 1.2"
color="green">
</a-text>

</a-marker>


<a-entity camera></a-entity>


</a-scene>


</body>

</html>
