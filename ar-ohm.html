<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>KVB VoltAR - Litar Hukum Ohm</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>


<style>

body{
    margin:0;
    overflow:hidden;
}

#backButton{
    position:fixed;
    top:20px;
    left:20px;
    z-index:999;

    padding:12px 20px;

    background:#1565c0;
    color:white;

    border:none;
    border-radius:8px;

    font-size:16px;
}

</style>

</head>


<body>


<button
id="backButton"
onclick="window.location.href='ohm.html'">

← Kembali

</button>


<a-scene
embedded
arjs="sourceType: webcam; debugUIEnabled:false;">


<!-- ========================= -->
<!-- ASET MODEL -->
<!-- ========================= -->

<a-assets>

    <a-asset-item
        id="batteryModel"
        src="models/battery.glb">
    </a-asset-item>

</a-assets>


<a-marker preset="hiro">


<!-- ========================= -->
<!-- KESELURUHAN PAPARAN AR -->
<!-- ========================= -->

<a-entity
id="ohmScene"
scale="0.45 0.45 0.45">


<!-- ========================= -->
<!-- PANEL FORMULA HUKUM OHM -->
<!-- ========================= -->

<a-plane
    position="0 2.85 -0.08"
    width="2.60"
    height="0.72"
    color="#E8F5E9"
    opacity="0.95">
</a-plane>

<a-text
    value="HUKUM OHM"
    position="0 3.02 0.02"
    align="center"
    width="3.80"
    color="#1B5E20">
</a-text>

<a-text
    value="V = I x R"
    position="0 2.72 0.02"
    align="center"
    width="3.20"
    color="#1B5E20">
</a-text>


<!-- ========================= -->
<!-- PENERANGAN FORMULA -->
<!-- ========================= -->

<a-plane
    position="0 2.28 -0.08"
    width="2.45"
    height="0.38"
    color="#FFFFFF"
    opacity="0.95">
</a-plane>

<a-text
    value="Hubungan antara voltan,\narus dan rintangan."
    position="0 2.28 0.02"
    align="center"
    width="2.65"
    color="#263238">
</a-text>


<!-- ========================= -->
<!-- TAJUK SUMBER VOLTAN -->
<!-- ========================= -->

<a-text
    value="SUMBER VOLTAN (V)"
    position="0 1.88 0.02"
    align="center"
    width="3.30"
    color="#0D47A1">
</a-text>


<!-- ========================= -->
<!-- PENERANGAN SUMBER VOLTAN -->
<!-- ========================= -->

<a-plane
    position="0 1.55 -0.08"
    width="1.90"
    height="0.34"
    color="#E3F2FD"
    opacity="0.95">
</a-plane>

<a-text
    value="Membekalkan tenaga kepada litar."
    position="0 1.55 0.02"
    align="center"
    width="2.25"
    color="#0D47A1">
</a-text>


<!-- ========================= -->
<!-- MODEL BATERI -->
<!-- ========================= -->

<a-entity
    gltf-model="#batteryModel"
    position="0 0.75 0"
    rotation="180 180 0"
    scale="5.5 5.5 5.5">
</a-entity>


<!-- ========================= -->
<!-- LABEL TERMINAL POSITIF -->
<!-- ========================= -->

<a-plane
    position="-1.10 1.02 -0.08"
    width="1.05"
    height="0.38"
    color="#FFEBEE"
    opacity="0.95">
</a-plane>

<a-text
    value="TERMINAL\nPOSITIF (+)"
    position="-1.10 1.02 0.02"
    align="center"
    width="1.65"
    color="#D50000">
</a-text>


<!-- ========================= -->
<!-- LABEL TERMINAL NEGATIF -->
<!-- ========================= -->

<a-plane
    position="1.10 0.42 -0.08"
    width="1.05"
    height="0.38"
    color="#ECEFF1"
    opacity="0.95">
</a-plane>

<a-text
    value="TERMINAL\nNEGATIF (-)"
    position="1.10 0.42 0.02"
    align="center"
    width="1.65"
    color="#212121">
</a-text>


<!-- ========================= -->
<!-- WAYAR -->
<!-- ========================= -->

<a-cylinder
    position="0 -0.10 0"
    radius="0.05"
    height="1.50"
    color="#1565c0">
</a-cylinder>


<!-- ========================= -->
<!-- ANIMASI ARUS -->
<!-- ========================= -->

<a-sphere
    radius="0.06"
    color="#00FF00"
    position="0 0.20 0.08"

    animation="
    property: position;
    from: 0 0.20 0.08;
    to: 0 -0.50 0.08;
    dur: 1500;
    dir: alternate;
    loop: true;
    easing: linear;">
</a-sphere>


<!-- ========================= -->
<!-- PANEL ARUS ELEKTRIK -->
<!-- ========================= -->

<a-plane
    position="-1.15 -0.18 -0.08"
    width="1.35"
    height="0.70"
    color="#E8F5E9"
    opacity="0.95">
</a-plane>

<a-text
    value="ARUS ELEKTRIK (I)"
    position="-1.15 0.02 0.02"
    align="center"
    width="1.95"
    color="#1B5E20">
</a-text>

<a-text
    value="Arus mengalir\napabila litar lengkap."
    position="-1.15 -0.27 0.02"
    align="center"
    width="1.70"
    color="#1B5E20">
</a-text>


<!-- ========================= -->
<!-- PERINTANG -->
<!-- ========================= -->

<a-box
    position="0 -1.00 0"
    width="0.45"
    height="0.25"
    depth="0.25"
    color="#D2691E">
</a-box>


<!-- ========================= -->
<!-- TAJUK RINTANGAN -->
<!-- ========================= -->

<a-text
    value="RINTANGAN (R)"
    position="0 -1.40 0.02"
    align="center"
    width="3.00"
    color="#E65100">
</a-text>


<!-- ========================= -->
<!-- PANEL PENERANGAN RINTANGAN -->
<!-- ========================= -->

<a-plane
    position="0 -1.76 -0.08"
    width="1.75"
    height="0.38"
    color="#FFF3E0"
    opacity="0.95">
</a-plane>

<a-text
    value="Mengurangkan aliran arus."
    position="0 -1.76 0.02"
    align="center"
    width="2.10"
    color="#E65100">
</a-text>


<!-- ========================= -->
<!-- RUMUSAN -->
<!-- ========================= -->

<a-plane
    position="0 -2.25 -0.08"
    width="2.80"
    height="0.50"
    color="#E3F2FD"
    opacity="0.95">
</a-plane>

<a-text
    value="Semakin besar rintangan,\nsemakin kecil arus."
    position="0 -2.25 0.02"
    align="center"
    width="2.80"
    color="#0D47A1">
</a-text>


</a-entity>

</a-marker>


<a-entity camera></a-entity>


</a-scene>


</body>

</html>
